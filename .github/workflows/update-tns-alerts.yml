name: Update TNS Alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch TNS alerts
        run: |
          python <<'PY'
          import csv
          import io
          import json
          import zipfile
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import requests


          BASE_URL = (
              "https://www.wis-tns.org/system/files/"
              "tns_public_objects/tns_public_objects_{hour}.csv.zip"
          )

          HEADERS = {
              "User-Agent": (
                  'tns_marker{"tns_id":4565,"type": "user", "name":"minnican"}'
              )
          }

          OUTPUT = Path("data/tns-alerts.json")

          NOW = datetime.now(timezone.utc)
          CUTOFF = NOW - timedelta(hours=24)

          print("Current UTC time:", NOW.isoformat())
          print("24-hour cutoff:", CUTOFF.isoformat())


          def parse_tns_datetime(value):
              """Parse a TNS timestamp into an aware UTC datetime."""

              if not value:
                  return None

              value = value.strip()

              formats = (
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M:%S.%f",
              )

              for fmt in formats:
                  try:
                      return datetime.strptime(
                          value,
                          fmt
                      ).replace(tzinfo=timezone.utc)
                  except ValueError:
                      pass

              return None


          def parse_iso_datetime(value):
              """Parse an ISO timestamp into an aware UTC datetime."""

              if not value:
                  return None

              try:
                  parsed = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(
                          tzinfo=timezone.utc
                      )

                  return parsed.astimezone(timezone.utc)

              except ValueError:
                  return None


          def freshness(alert):
              """
              Return the best available timestamp for an existing alert.

              Newly generated records use lastModified where possible,
              while older records from the previous JSON may only have
              receivedTimestamp.
              """

              last_modified = parse_tns_datetime(
                  alert.get("lastModified", "")
              )

              if last_modified is not None:
                  return last_modified

              received_timestamp = parse_iso_datetime(
                  alert.get("receivedTimestamp", "")
              )

              if received_timestamp is not None:
                  return received_timestamp

              return parse_tns_datetime(
                  alert.get("received", "")
              )


          # ------------------------------------------------------------------
          # Load the existing JSON.
          #
          # This is important because the TNS hourly files only contain
          # objects from individual hourly periods. Carrying forward the
          # existing JSON allows us to maintain a genuine rolling 24-hour
          # window without downloading all 24 hourly files on every run.
          # ------------------------------------------------------------------

          existing_alerts = []
          existing_generated = None

          if OUTPUT.exists():

              try:
                  existing_data = json.loads(
                      OUTPUT.read_text(
                          encoding="utf-8"
                      )
                  )

                  existing_alerts = existing_data.get(
                      "alerts",
                      []
                  )

                  existing_generated = existing_data.get(
                      "generated"
                  )

                  print(
                      "Existing alerts loaded:",
                      len(existing_alerts)
                  )

              except Exception as exc:

                  print(
                      "Could not read existing JSON:",
                      exc
                  )


          # ------------------------------------------------------------------
          # Start with existing alerts that are still within the rolling
          # 24-hour window.
          # ------------------------------------------------------------------

          merged = {}

          for alert in existing_alerts:

              timestamp = freshness(alert)

              if timestamp is None:
                  continue

              if timestamp < CUTOFF:
                  continue

              name = (
                  alert.get("name") or ""
              ).strip()

              object_id = (
                  str(alert.get("objectId") or "")
                  .strip()
              )

              key = object_id or name

              if not key:
                  continue

              merged[key] = alert


          print(
              "Existing alerts retained:",
              len(merged)
          )


          # ------------------------------------------------------------------
          # Download the latest three available hourly TNS files.
          #
          # The files are named for the hour following the period they
          # contain. For example, file 08 contains the 07:00-08:00 UTC
          # period.
          # ------------------------------------------------------------------

          records = {}

          for hours_ago in range(3):

              target = NOW - timedelta(
                  hours=hours_ago
              )

              hour = target.strftime("%H")

              url = BASE_URL.format(
                  hour=hour
              )

              print(
                  f"Fetching hour {hour} "
                  f"({target.strftime('%Y-%m-%d %H:%M UTC')})"
              )

              try:

                  response = requests.post(
                      url,
                      headers=HEADERS,
                      timeout=60,
                  )

                  if response.status_code == 404:

                      print(
                          f"  Hour {hour}: not available"
                      )

                      continue

                  response.raise_for_status()

                  with zipfile.ZipFile(
                      io.BytesIO(response.content)
                  ) as archive:

                      csv_names = [
                          name
                          for name in archive.namelist()
                          if name.lower().endswith(".csv")
                      ]

                      if not csv_names:

                          print(
                              f"  Hour {hour}: "
                              "no CSV in ZIP"
                          )

                          continue

                      csv_name = csv_names[0]

                      with archive.open(
                          csv_name
                      ) as csv_file:

                          text = io.TextIOWrapper(
                              csv_file,
                              encoding="utf-8-sig"
                          )

                          period = next(
                              text,
                              ""
                          ).strip()

                          print(
                              f"  Period: {period}"
                          )

                          reader = csv.DictReader(text)

                          count = 0

                          for row in reader:

                              objid = (
                                  row.get("objid") or ""
                              ).strip()

                              if not objid:
                                  continue

                              existing = records.get(
                                  objid
                              )

                              if existing is None:

                                  records[objid] = row

                              else:

                                  existing_modified = (
                                      existing.get(
                                          "lastmodified"
                                      )
                                      or ""
                                  ).strip()

                                  new_modified = (
                                      row.get(
                                          "lastmodified"
                                      )
                                      or ""
                                  ).strip()

                                  if new_modified > existing_modified:

                                      records[objid] = row

                              count += 1

                          print(
                              f"  Records in file: {count}"
                          )

              except Exception as exc:

                  print(
                      f"  Hour {hour}: "
                      f"could not be downloaded/read: {exc}"
                  )


          print(
              "Unique TNS objects collected:",
              len(records)
          )


          # ------------------------------------------------------------------
          # SAFETY CHECK
          #
          # If every TNS download failed, stop the workflow rather than
          # replacing valid existing alert data with an empty JSON file.
          # ------------------------------------------------------------------

          if not records:

              raise RuntimeError(
                  "No TNS hourly data could be downloaded. "
                  "Refusing to overwrite existing TNS alert data."
              )


          # ------------------------------------------------------------------
          # Convert new TNS records into the site's JSON format.
          #
          # We use lastmodified as the freshness timestamp for the rolling
          # window because TNS can update an existing object when it receives
          # a classification. Its original time_received may therefore be
          # much older than the alert update.
          # ------------------------------------------------------------------

          new_alerts = {}

          for row in records.values():

              name_prefix = (
                  row.get("name_prefix") or ""
              ).strip()

              name = (
                  row.get("name") or ""
              ).strip()

              object_type = name_prefix.upper()

              if not name:
                  continue

              if object_type not in {
                  "AT",
                  "SN",
              }:
                  continue

              time_received = (
                  row.get("time_received") or ""
              ).strip()

              received_dt = parse_tns_datetime(
                  time_received
              )

              if received_dt is None:
                  continue

              classification = (
                  row.get("type") or ""
              ).strip()

              reporting_group = (
                  row.get("reporting_group") or ""
              ).strip()

              discovery_date = (
                  row.get("discoverydate") or ""
              ).strip()

              last_modified = (
                  row.get("lastmodified") or ""
              ).strip()

              modified_dt = parse_tns_datetime(
                  last_modified
              )

              # Prefer lastmodified because this detects recent
              # classifications/updates to existing objects.
              event_dt = (
                  modified_dt
                  if modified_dt is not None
                  else received_dt
              )

              if event_dt is None:
                  continue

              # Ignore future-dated records caused by clock differences,
              # but allow a small five-minute tolerance.
              if event_dt > NOW + timedelta(minutes=5):
                  continue

              if event_dt < CUTOFF:
                  continue

              objid = (
                  row.get("objid") or ""
              ).strip()

              object_url = (
                  "https://www.wis-tns.org/object/"
                  + name
              )

              alert = {
                  "name": (
                      f"{object_type} {name}"
                  ),
                  "url": object_url,
                  "objectId": objid,
                  "received": time_received,
                  "receivedTimestamp": (
                      received_dt.isoformat()
                  ),
                  "objectType": object_type,
                  "classification": classification,
                  "discoveryDate": discovery_date,
                  "lastModified": last_modified,
                  "reportingGroup": reporting_group,
              }

              # Keep the newest version if the same object occurs
              # more than once.
              key = objid or name

              existing_new = new_alerts.get(
                  key
              )

              if existing_new is None:

                  new_alerts[key] = alert

              else:

                  old_dt = freshness(
                      existing_new
                  )

                  if old_dt is None or event_dt > old_dt:

                      new_alerts[key] = alert


          print(
              "New/updated qualifying alerts:",
              len(new_alerts)
          )


          # ------------------------------------------------------------------
          # Merge the newly downloaded records with the existing rolling
          # 24-hour data.
          # ------------------------------------------------------------------

          for key, alert in new_alerts.items():

              existing = merged.get(key)

              if existing is None:

                  merged[key] = alert
                  continue

              new_timestamp = freshness(
                  alert
              )

              old_timestamp = freshness(
                  existing
              )

              if (
                  old_timestamp is None
                  or (
                      new_timestamp is not None
                      and new_timestamp > old_timestamp
                  )
              ):

                  merged[key] = alert


          # ------------------------------------------------------------------
          # Remove anything that is now outside the rolling 24-hour window.
          # ------------------------------------------------------------------

          filtered = []

          for alert in merged.values():

              timestamp = freshness(
                  alert
              )

              if timestamp is None:
                  continue

              if timestamp < CUTOFF:
                  continue

              filtered.append(
                  alert
              )


          # Newest activity first.
          filtered.sort(
              key=lambda alert: (
                  freshness(alert)
                  or datetime.min.replace(
                      tzinfo=timezone.utc
                  )
              ),
              reverse=True
          )

          # Keep the latest 30 alerts.
          filtered = filtered[:30]


          # ------------------------------------------------------------------
          # Preserve the previous generated timestamp if the actual alert
          # data has not changed. This prevents a new Git commit every
          # 15 minutes merely because the generated timestamp changed.
          # ------------------------------------------------------------------

          previous_alerts = existing_alerts

          if previous_alerts == filtered:

              generated = (
                  existing_generated
                  or NOW.isoformat()
              )

          else:

              generated = NOW.isoformat()


          output = {
              "generated": generated,
              "source": (
                  "TNS hourly public-object feed "
                  "(rolling 24 hours)"
              ),
              "count": len(filtered),
              "alerts": filtered,
          }


          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )


          print(
              f"Qualifying TNS alerts: "
              f"{len(filtered)}"
          )

          for alert in filtered[:10]:

              classification = (
                  alert["classification"]
                  if alert["classification"]
                  else alert["objectType"]
              )

              print(
                  alert["received"],
                  alert["name"],
                  classification,
                  alert["lastModified"]
              )

          print(
              f"Wrote {OUTPUT}"
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tns-alerts.json

          if git diff --cached --quiet; then
            echo "No TNS changes to commit."
          else
            git commit -m "Update TNS alerts"
            git push
          fi
          