name: Update YouTube live broadcast

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatory-data-updates
  cancel-in-progress: false

jobs:
  update-youtube-live:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Discover current live broadcast
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          CHANNEL_ID = "UCccorppDsBV6KsN6zUe7axg"
          API_URL = "https://www.googleapis.com/youtube/v3/search"
          OUTPUT = Path("data/youtube-live.json")

          api_key = os.environ.get("YOUTUBE_API_KEY")
          if not api_key:
              raise RuntimeError("YOUTUBE_API_KEY secret is missing.")

          params = urllib.parse.urlencode({
              "key": api_key,
              "channelId": CHANNEL_ID,
              "eventType": "live",
              "type": "video",
              "part": "snippet",
              "maxResults": 1,
          })

          request = urllib.request.Request(
              f"{API_URL}?{params}",
              headers={
                  "User-Agent": "BillingboroughObservatory/1.0"
              },
          )

          print(f"Checking for a live broadcast on {CHANNEL_ID}")

          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          items = payload.get("items", [])

          # Read the previous state before deciding whether the stream
          # is offline. An empty search result is not proof it has ended.
          existing = {}
          if OUTPUT.exists():
              existing = json.loads(OUTPUT.read_text(encoding="utf-8"))

          video_id = None
          confirmed_offline = False

          if items:
              video_id = items[0].get("id", {}).get("videoId")

          if not video_id:
              previous_id = existing.get("videoId") or "cvtXrj6Bekc"
              print(
                  "Channel search returned no broadcast; checking "
                  f"previous video {previous_id} directly."
              )

              check_params = urllib.parse.urlencode({
                  "key": api_key,
                  "id": previous_id,
                  "part": "snippet,liveStreamingDetails",
              })

              check_request = urllib.request.Request(
                  "https://www.googleapis.com/youtube/v3/videos?"
                  + check_params,
                  headers={
                      "User-Agent": "BillingboroughObservatory/1.0"
                  },
              )

              with urllib.request.urlopen(
                  check_request, timeout=30
              ) as response:
                  video_payload = json.load(response)

              for video in video_payload.get("items", []):
                  details = video.get("liveStreamingDetails", {})
                  snippet = video.get("snippet", {})

                  if (
                      snippet.get("liveBroadcastContent") == "live"
                      or (
                          details.get("actualStartTime")
                          and not details.get("actualEndTime")
                      )
                  ):
                      video_id = video.get("id")
                      print(
                          "Known broadcast confirmed by video lookup: "
                          f"{video_id}"
                      )
                      break

                  if details.get("actualEndTime"):
                      confirmed_offline = True
                      print(
                          f"YouTube confirms that {previous_id} has ended."
                      )

          if video_id:
              desired = {
                  "channelId": CHANNEL_ID,
                  "isLive": True,
                  "videoId": video_id,
                  "watchUrl": f"https://www.youtube.com/watch?v={video_id}",
                  "embedUrl": f"https://www.youtube-nocookie.com/embed/{video_id}",
              }
              print(f"Live broadcast found: {video_id}")

          elif confirmed_offline:
              desired = {
                  "channelId": CHANNEL_ID,
                  "isLive": False,
                  "videoId": None,
                  "watchUrl": None,
                  "embedUrl": None,
              }
              print("The previous broadcast has ended.")

          elif existing.get("videoId"):
              # The API has not established that the known broadcast
              # ended, so retain its previous state instead of hiding it.
              desired = {
                  "channelId": CHANNEL_ID,
                  "isLive": existing.get("isLive", True),
                  "videoId": existing["videoId"],
                  "watchUrl": existing.get("watchUrl"),
                  "embedUrl": existing.get("embedUrl"),
              }
              print(
                  "Broadcast status is inconclusive; preserving "
                  f"the previous video {existing['videoId']}."
              )

          else:
              desired = {
                  "channelId": CHANNEL_ID,
                  "isLive": False,
                  "videoId": None,
                  "watchUrl": None,
                  "embedUrl": None,
              }
              print("No broadcast has been found yet.")

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          # Avoid needless commits when the broadcast hasn't changed.
          fields = ("channelId", "isLive", "videoId")
          if all(existing.get(key) == desired[key] for key in fields):
              print("Broadcast state unchanged; no update needed.")
          else:
              desired["updatedAt"] = datetime.now(
                  timezone.utc
              ).isoformat()

              OUTPUT.write_text(
                  json.dumps(desired, indent=2) + "\n",
                  encoding="utf-8",
              )
              print(f"Updated {OUTPUT}")
          PY

      - name: Commit updated broadcast status
        run: |
          git config user.name "Billingborough Observatory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/youtube-live.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update YouTube live broadcast status"

            git fetch origin main
            git rebase origin/main
            git push
          fi
