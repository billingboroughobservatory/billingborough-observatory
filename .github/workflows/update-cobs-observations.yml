name: Update COBS comet observations

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Fetch COBS observations
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          API_URL = "https://cobs.si/api/obs_list.api"

          # Look back 48 hours so delayed COBS submissions are not missed.
          since = datetime.now(timezone.utc) - timedelta(hours=48)
          from_date = since.strftime("%Y-%m-%d %H:%M")

          params = urllib.parse.urlencode({
              "format": "json",
              "from_date": from_date,
              "obs_type": "C"
          })

          url = f"{API_URL}?{params}"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "BillingboroughObservatory/1.0"
              }
          )

          print(f"Requesting COBS observations from {from_date} UTC")

          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          # COBS returns observations in an "objects" array.
          raw_observations = payload.get("objects", [])

          if not isinstance(raw_observations, list):
              raise RuntimeError(
                  "Unexpected COBS response: 'objects' is not a list."
              )

          signature = payload.get("signature", {})
          api_version = signature.get("version", "")

          observations = []

          # Cache COBS comet IDs so each comet is looked up only once.
          comet_ids = {}

          for item in raw_observations:
              comet = item.get("comet") or {}
              observer = item.get("observer") or {}
              method = item.get("obs_method") or {}

              comet_name = (
                  comet.get("fullname")
                  or comet.get("name")
                  or ""
              ).strip()

              if not comet_name:
                  continue

              # Obtain the COBS internal comet ID using the MPC
              # packed designation supplied by the observation API.
              mpc_name = comet.get("mpc_name") or ""

              if mpc_name and mpc_name not in comet_ids:
                  try:
                      comet_params = urllib.parse.urlencode({
                          "des": mpc_name
                      })

                      comet_api_url = (
                          "https://cobs.si/api/comet.api?"
                          + comet_params
                      )

                      comet_request = urllib.request.Request(
                          comet_api_url,
                          headers={
                              "User-Agent":
                                  "BillingboroughObservatory/1.0"
                          }
                      )

                      with urllib.request.urlopen(
                          comet_request,
                          timeout=30
                      ) as comet_response:
                          comet_data = json.load(comet_response)

                      comet_object = comet_data.get("object") or {}
                      comet_ids[mpc_name] = comet_object.get("id")

                      print(
                          f"COBS ID: {mpc_name} -> "
                          f"{comet_ids[mpc_name]}"
                      )

                  except Exception as error:
                      print(
                          f"Could not find COBS ID for "
                          f"{mpc_name}: {error}"
                      )
                      comet_ids[mpc_name] = None

              cobs_id = comet_ids.get(mpc_name)

              if cobs_id:
                  cobs_url = (
                      f"https://cobs.si/comet/{cobs_id}/"
                  )
              else:
                  cobs_url = "https://cobs.si/recent/"

              observer_name = " ".join(
                  part.strip()
                  for part in [
                      observer.get("first_name") or "",
                      observer.get("last_name") or ""
                  ]
                  if part and part.strip()
              )

              observations.append({
                  "comet": comet_name,
                  "mpcName": mpc_name,
                  "icqName": comet.get("icq_name") or "",
                  "observationDate": item.get("obs_date") or "",
                  "observer": observer_name,
                  "observerCode": observer.get("icq_name") or "",
                  "association": observer.get("association") or "",
                  "country": observer.get("country") or "",
                  "location": item.get("location") or "",
                  "method": method.get("name") or "",
                  "methodCode": method.get("key") or "",
                  "magnitude": item.get("magnitude"),
                  "conditions": item.get("conditions"),
                  "cobsUrl": cobs_url
              })

          # Newest observations first.
          observations.sort(
              key=lambda item: item.get("observationDate", ""),
              reverse=True
          )

          # Keep the latest 100 observations.
          observations = observations[:100]

          output = {
              "source": "COBS — Comet OBServation database",
              "sourceUrl": "https://cobs.si/recent/",
              "apiUrl": API_URL,
              "generated": datetime.now(timezone.utc).isoformat(),
              "apiVersion": api_version,
              "observationCount": len(observations),
              "observations": observations
          }

          output_path = Path("data/cobs-observations.json")
          output_path.parent.mkdir(parents=True, exist_ok=True)

          output_path.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              f"Saved {len(observations)} observations "
              f"to {output_path}"
          )
          PY

      - name: Commit updated observations
        run: |
          git config user.name "Billingborough Observatory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cobs-observations.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update COBS comet observations"
            git push
          fi